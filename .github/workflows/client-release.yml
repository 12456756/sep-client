name: SEP Client Release

on:
  push:
    tags:
      - 'v*'
      - 'client-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified bundle to the client download server
        required: true
        default: false
        type: boolean
      transfer:
        description: Server download (recommended), or manual SSH upload fallback
        required: true
        default: server-pull
        type: choice
        options:
          - server-pull
          - ssh

permissions:
  contents: read

concurrency:
  group: sep-client-stable-release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - name: Check version release notes
        run: npm run release:notes:check
      - name: Cache pinned speech assets
        uses: actions/cache@v4
        with:
          path: |
            resources/speech/sensevoice-int8/model.int8.onnx
            resources/speech/sensevoice-int8/tokens.txt
          key: speech-v1-${{ runner.os }}-${{ hashFiles('resources/speech/sensevoice-int8/manifest.json') }}
      - name: Prepare pinned speech assets
        run: npm run speech:prepare
      - name: Check release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          normalized="${GITHUB_REF_NAME#client-}"
          test "$normalized" = "$expected"
      - run: npm run typecheck
      - run: npm run test:packaging
      - run: npm run test:updates

  preflight:
    needs: validate
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    environment: sep-download-production
    steps:
      - uses: actions/checkout@v4
      - name: Check download server SSH access
        env:
          SEP_UPLOAD_HOST: ${{ secrets.SEP_UPLOAD_HOST || '121.37.128.126' }}
          SEP_UPLOAD_USER: ${{ secrets.SEP_UPLOAD_USER || 'root' }}
          SEP_UPLOAD_ROOT: ${{ secrets.SEP_UPLOAD_ROOT || '/www/sep/downloads/sep-client/stable' }}
          SEP_UPLOAD_SSH_KEY_BASE64: ${{ secrets.SEP_UPLOAD_SSH_KEY_BASE64 }}
          SEP_UPLOAD_KNOWN_HOSTS: ${{ secrets.SEP_UPLOAD_KNOWN_HOSTS }}
          SEP_UPLOAD_PORT: ${{ secrets.SEP_UPLOAD_PORT || '22' }}
          SEP_RELEASE_TRANSFER: ${{ inputs.transfer || 'server-pull' }}
          SEP_RELEASE_WORK_ROOT: ${{ vars.SEP_RELEASE_WORK_ROOT || '/www/sep/.sep-client-releases' }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$SEP_RELEASE_TRANSFER" = ssh ]; then
            node scripts/upload-download-update.mjs --preflight "$version"
          else
            node scripts/server-pull-release.mjs --preflight "$version"
          fi

  build-mac:
    name: Build macOS (${{ matrix.arch }})
    needs: [validate, preflight]
    if: always() && needs.validate.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-
      - run: npm ci
      - name: Install pinned target macOS speech runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --force sherpa-onnx-darwin-${{ matrix.arch }}@1.13.8
      - name: Cache pinned speech assets
        uses: actions/cache@v4
        with:
          path: |
            resources/speech/sensevoice-int8/model.int8.onnx
            resources/speech/sensevoice-int8/tokens.txt
          key: speech-v1-${{ runner.os }}-${{ hashFiles('resources/speech/sensevoice-int8/manifest.json') }}
      - name: Prepare pinned speech assets
        run: npm run speech:prepare
      - name: Cache pinned OfficeCLI assets
        uses: actions/cache@v4
        with:
          path: resources/office/officecli-mac-${{ matrix.arch }}
          key: officecli-v2-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('resources/office/manifest.json') }}
      - name: Prepare pinned target OfficeCLI asset
        run: npm run office:prepare -- darwin ${{ matrix.arch }}
      - name: Build pinned FFmpeg for macOS
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          FFMPEG_BUILD_JOBS: 3
        run: bash scripts/build-local-media-mac.sh "$TARGET_ARCH"
      - run: npm run package:ci:stable:mac -- dmg zip --${{ matrix.arch }}
      - name: Exercise the signed FFmpeg binaries from the macOS app
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          product=$(node -p 'require("./package.json").build.productName')
          paths=(dist/local/stable/mac*/"$product.app"/Contents/Resources/local-media)
          test "${#paths[@]}" = 1
          export SEP_LOCAL_MEDIA_DEV_DIR="$PWD/${paths[0]}"
          native="$TARGET_ARCH"
          if [ "$native" = x64 ]; then native=x86_64; fi
          for tool in ffmpeg ffprobe; do
            test "$(lipo -archs "$SEP_LOCAL_MEDIA_DEV_DIR/$tool")" = "$native"
            codesign --verify --strict "$SEP_LOCAL_MEDIA_DEV_DIR/$tool"
          done
          npx --no-install tsx --test electron/runtime/local-media-runtime.test.ts electron/service/local-media-settings-service.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: sep-client-mac-${{ matrix.arch }}
          path: |
            dist/local/stable/*.dmg
            dist/local/stable/*.zip
            dist/local/stable/*.blockmap
            dist/local/stable/latest-mac.yml
            dist/local/stable/connector-assets/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  build-win:
    needs: [validate, preflight]
    if: always() && needs.validate.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies with Windows PowerShell module isolation
        shell: cmd
        # npm postinstall launches powershell.exe through Node/cmd; avoid inherited PS7 modules.
        run: |
          set "PSModulePath="
          npm ci
      - name: Cache pinned speech assets
        uses: actions/cache@v4
        with:
          path: |
            resources/speech/sensevoice-int8/model.int8.onnx
            resources/speech/sensevoice-int8/tokens.txt
          key: speech-v1-${{ runner.os }}-${{ hashFiles('resources/speech/sensevoice-int8/manifest.json') }}
      - name: Prepare pinned speech assets
        run: npm run speech:prepare
      - name: Cache pinned OfficeCLI assets
        uses: actions/cache@v4
        with:
          path: resources/office/officecli-win-x64.exe
          key: officecli-v1-${{ runner.os }}-${{ hashFiles('resources/office/manifest.json') }}
      - name: Prepare pinned OfficeCLI assets
        run: npm run office:prepare
      - name: Prepare UCRT build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: make diffutils curl nasm mingw-w64-ucrt-x86_64-gcc
      - name: Ensure Windows Media Foundation is available
        shell: powershell
        run: |
          $feature = Get-WindowsFeature Server-Media-Foundation
          if (-not $feature.Installed) {
            $installed = Install-WindowsFeature Server-Media-Foundation
            if (-not $installed.Success -or $installed.RestartNeeded -eq 'Yes') { throw 'Media Foundation is not available for FFmpeg verification' }
          }
      - name: Build pinned FFmpeg for Windows
        shell: msys2 {0}
        run: bash scripts/build-local-media-win.sh
      - name: Exercise the Windows FFmpeg binaries before packaging
        env:
          SEP_LOCAL_MEDIA_DEV_DIR: ${{ github.workspace }}/resources/local-media/win-x64
        run: npx --no-install tsx --test electron/runtime/local-media-runtime.test.ts
      - name: Check bundled Bash corresponding sources
        run: node scripts/bash-runtime-packaging.mjs --check-sources
      - run: npm run package:ci:stable:win
      - name: Exercise the Bash runtime from the packaged resources
        env:
          SEP_TEST_BASH_RESOURCES: ${{ github.workspace }}/dist/local/stable/win-unpacked/resources
        run: npx --no-install tsx --test electron/pi/sdk/pi-bash-shell.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: sep-client-win
          path: |
            dist/local/stable/*.exe
            dist/local/stable/*.blockmap
            dist/local/stable/latest.yml
            dist/local/stable/connector-assets/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    env:
      SEP_RELEASE_TRANSFER: ${{ inputs.transfer || 'server-pull' }}
    needs: [validate, preflight, build-mac, build-win]
    if: >-
      always() && needs.validate.result == 'success'
      && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
      && needs['build-mac'].result == 'success' && needs['build-win'].result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'push' || inputs.publish == true) && 'sep-download-production' || 'sep-download-validation' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: sep-client-mac-arm64
          path: release-mac-arm64
      - uses: actions/download-artifact@v4
        with:
          name: sep-client-mac-x64
          path: release-mac-x64
      - uses: actions/download-artifact@v4
        with:
          name: sep-client-win
          path: release-win
      - name: Merge platform artifacts
        shell: bash
        run: |
          mkdir release-source
          cp -a release-mac-arm64/. release-source/
          cp -a release-mac-x64/. release-source/
          cp -a release-win/. release-source/
      - name: Merge macOS update manifests
        run: node scripts/merge-mac-update-manifests.mjs release-mac-arm64/latest-mac.yml release-mac-x64/latest-mac.yml release-source/latest-mac.yml
      - name: Verify independently downloadable connector components
        run: node scripts/verify-connector-assets.mjs release-source
      - run: node scripts/verify-update-manifest.mjs release-source --require-all-platforms
      - run: node scripts/prepare-download-update.mjs release-source stable release-prepared
      - name: Save verified bundle for packaging-only runs
        if: github.event_name != 'push' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: sep-client-release-${{ github.run_id }}
          path: |
            release-source
            release-prepared
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Prepare verified server download bundle
        if: (github.event_name == 'push' || inputs.publish == true) && env.SEP_RELEASE_TRANSFER == 'server-pull'
        run: node scripts/server-pull-release.mjs --prepare release-source release-prepared release-server-pull
      - name: Save verified server download bundle
        id: server-pull-artifact
        if: (github.event_name == 'push' || inputs.publish == true) && env.SEP_RELEASE_TRANSFER == 'server-pull'
        uses: actions/upload-artifact@v4
        with:
          name: sep-client-server-pull-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-server-pull/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Download and publish from the server
        if: (github.event_name == 'push' || inputs.publish == true) && env.SEP_RELEASE_TRANSFER == 'server-pull'
        env:
          GH_TOKEN: ${{ github.token }}
          SEP_PULL_ARTIFACT_ID: ${{ steps.server-pull-artifact.outputs.artifact-id }}
          SEP_UPLOAD_HOST: ${{ secrets.SEP_UPLOAD_HOST || '121.37.128.126' }}
          SEP_UPLOAD_USER: ${{ secrets.SEP_UPLOAD_USER || 'root' }}
          SEP_UPLOAD_ROOT: ${{ secrets.SEP_UPLOAD_ROOT || '/www/sep/downloads/sep-client/stable' }}
          SEP_UPLOAD_SSH_KEY_BASE64: ${{ secrets.SEP_UPLOAD_SSH_KEY_BASE64 }}
          SEP_UPLOAD_KNOWN_HOSTS: ${{ secrets.SEP_UPLOAD_KNOWN_HOSTS }}
          SEP_UPLOAD_PORT: ${{ secrets.SEP_UPLOAD_PORT || '22' }}
          SEP_RELEASE_WORK_ROOT: ${{ vars.SEP_RELEASE_WORK_ROOT || '/www/sep/.sep-client-releases' }}
        run: node scripts/server-pull-release.mjs --publish "$SEP_PULL_ARTIFACT_ID" release-server-pull
      - name: Upload client files and publish manifests last
        if: (github.event_name == 'push' || inputs.publish == true) && env.SEP_RELEASE_TRANSFER == 'ssh'
        env:
          SEP_UPLOAD_HOST: ${{ secrets.SEP_UPLOAD_HOST || '121.37.128.126' }}
          SEP_UPLOAD_USER: ${{ secrets.SEP_UPLOAD_USER || 'root' }}
          SEP_UPLOAD_ROOT: ${{ secrets.SEP_UPLOAD_ROOT || '/www/sep/downloads/sep-client/stable' }}
          SEP_UPLOAD_SSH_KEY_BASE64: ${{ secrets.SEP_UPLOAD_SSH_KEY_BASE64 }}
          SEP_UPLOAD_KNOWN_HOSTS: ${{ secrets.SEP_UPLOAD_KNOWN_HOSTS }}
          SEP_UPLOAD_PORT: ${{ secrets.SEP_UPLOAD_PORT || '22' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/upload-download-update.mjs release-source release-prepared stable
      - name: Verify the public update feed
        if: (github.event_name == 'push' || inputs.publish == true) && env.SEP_RELEASE_TRANSFER == 'ssh'
        run: node scripts/test-update-feed.mjs https://sep.longdaoec.com/sep-client/stable/ --require-all-platforms --timeout-ms 120000
