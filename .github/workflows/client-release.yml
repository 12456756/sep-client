name: SEP Client Release

on:
  push:
    tags:
      - 'v*'
      - 'client-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified bundle to the client download server
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sep-client-stable-release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - name: Check version release notes
        run: npm run release:notes:check
      - name: Cache pinned speech assets
        uses: actions/cache@v4
        with:
          path: |
            resources/speech/sensevoice-int8/model.int8.onnx
            resources/speech/sensevoice-int8/tokens.txt
          key: speech-v1-${{ runner.os }}-${{ hashFiles('resources/speech/sensevoice-int8/manifest.json') }}
      - name: Prepare pinned speech assets
        run: npm run speech:prepare
      - name: Check release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          normalized="${GITHUB_REF_NAME#client-}"
          test "$normalized" = "$expected"
      - run: npm run typecheck
      - run: npm run test:packaging
      - run: npm run test:updates

  preflight:
    needs: validate
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    environment: sep-download-production
    steps:
      - uses: actions/checkout@v4
      - name: Check download server SSH access
        env:
          SEP_UPLOAD_HOST: ${{ secrets.SEP_UPLOAD_HOST || '121.37.128.126' }}
          SEP_UPLOAD_USER: ${{ secrets.SEP_UPLOAD_USER || 'root' }}
          SEP_UPLOAD_ROOT: ${{ secrets.SEP_UPLOAD_ROOT || '/www/sep/downloads/sep-client/stable' }}
          SEP_UPLOAD_SSH_KEY_BASE64: ${{ secrets.SEP_UPLOAD_SSH_KEY_BASE64 }}
          SEP_UPLOAD_KNOWN_HOSTS: ${{ secrets.SEP_UPLOAD_KNOWN_HOSTS }}
          SEP_UPLOAD_PORT: ${{ secrets.SEP_UPLOAD_PORT || '22' }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/upload-download-update.mjs --preflight "$version"

  build-mac:
    name: Build macOS (${{ matrix.arch }})
    needs: [validate, preflight]
    if: always() && needs.validate.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-
      - run: npm ci
      - name: Install pinned target macOS speech runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --force sherpa-onnx-darwin-${{ matrix.arch }}@1.13.8
      - name: Cache pinned speech assets
        uses: actions/cache@v4
        with:
          path: |
            resources/speech/sensevoice-int8/model.int8.onnx
            resources/speech/sensevoice-int8/tokens.txt
          key: speech-v1-${{ runner.os }}-${{ hashFiles('resources/speech/sensevoice-int8/manifest.json') }}
      - name: Prepare pinned speech assets
        run: npm run speech:prepare
      - name: Cache pinned OfficeCLI assets
        uses: actions/cache@v4
        with:
          path: resources/office/officecli-mac-${{ matrix.arch }}
          key: officecli-v2-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('resources/office/manifest.json') }}
      - name: Prepare pinned target OfficeCLI asset
        run: npm run office:prepare -- darwin ${{ matrix.arch }}
      - run: npm run package:ci:stable:mac -- dmg zip --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: sep-client-mac-${{ matrix.arch }}
          path: |
            dist/local/stable/*.dmg
            dist/local/stable/*.zip
            dist/local/stable/*.blockmap
            dist/local/stable/latest-mac.yml
            dist/local/stable/connector-assets/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  build-win:
    needs: [validate, preflight]
    if: always() && needs.validate.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies with Windows PowerShell module isolation
        shell: cmd
        # npm postinstall launches powershell.exe through Node/cmd; avoid inherited PS7 modules.
        run: |
          set "PSModulePath="
          npm ci
      - name: Cache pinned speech assets
        uses: actions/cache@v4
        with:
          path: |
            resources/speech/sensevoice-int8/model.int8.onnx
            resources/speech/sensevoice-int8/tokens.txt
          key: speech-v1-${{ runner.os }}-${{ hashFiles('resources/speech/sensevoice-int8/manifest.json') }}
      - name: Prepare pinned speech assets
        run: npm run speech:prepare
      - name: Cache pinned OfficeCLI assets
        uses: actions/cache@v4
        with:
          path: resources/office/officecli-win-x64.exe
          key: officecli-v1-${{ runner.os }}-${{ hashFiles('resources/office/manifest.json') }}
      - name: Prepare pinned OfficeCLI assets
        run: npm run office:prepare
      - run: npm run package:ci:stable:win
      - uses: actions/upload-artifact@v4
        with:
          name: sep-client-win
          path: |
            dist/local/stable/*.exe
            dist/local/stable/*.blockmap
            dist/local/stable/latest.yml
            dist/local/stable/connector-assets/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, preflight, build-mac, build-win]
    if: >-
      always() && needs.validate.result == 'success'
      && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
      && needs['build-mac'].result == 'success' && needs['build-win'].result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'push' || inputs.publish == true) && 'sep-download-production' || 'sep-download-validation' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: sep-client-mac-arm64
          path: release-mac-arm64
      - uses: actions/download-artifact@v4
        with:
          name: sep-client-mac-x64
          path: release-mac-x64
      - uses: actions/download-artifact@v4
        with:
          name: sep-client-win
          path: release-win
      - name: Merge platform artifacts
        shell: bash
        run: |
          mkdir release-source
          cp -a release-mac-arm64/. release-source/
          cp -a release-mac-x64/. release-source/
          cp -a release-win/. release-source/
      - name: Merge macOS update manifests
        run: node scripts/merge-mac-update-manifests.mjs release-mac-arm64/latest-mac.yml release-mac-x64/latest-mac.yml release-source/latest-mac.yml
      - name: Verify independently downloadable connector components
        run: node scripts/verify-connector-assets.mjs release-source
      - run: node scripts/verify-update-manifest.mjs release-source --require-all-platforms
      - run: node scripts/prepare-download-update.mjs release-source stable release-prepared
      - name: Save verified bundle for packaging-only runs
        if: github.event_name != 'push' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: sep-client-release-${{ github.run_id }}
          path: |
            release-source
            release-prepared
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload client files and publish manifests last
        if: github.event_name == 'push' || inputs.publish == true
        env:
          SEP_UPLOAD_HOST: ${{ secrets.SEP_UPLOAD_HOST || '121.37.128.126' }}
          SEP_UPLOAD_USER: ${{ secrets.SEP_UPLOAD_USER || 'root' }}
          SEP_UPLOAD_ROOT: ${{ secrets.SEP_UPLOAD_ROOT || '/www/sep/downloads/sep-client/stable' }}
          SEP_UPLOAD_SSH_KEY_BASE64: ${{ secrets.SEP_UPLOAD_SSH_KEY_BASE64 }}
          SEP_UPLOAD_KNOWN_HOSTS: ${{ secrets.SEP_UPLOAD_KNOWN_HOSTS }}
          SEP_UPLOAD_PORT: ${{ secrets.SEP_UPLOAD_PORT || '22' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/upload-download-update.mjs release-source release-prepared stable
      - name: Verify the public update feed
        if: github.event_name == 'push' || inputs.publish == true
        run: node scripts/test-update-feed.mjs https://sep.longdaoec.com/sep-client/stable/ --require-all-platforms --timeout-ms 120000
